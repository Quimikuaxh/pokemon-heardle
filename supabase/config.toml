# Solo para la Edge Function `heardle` y las migraciones de este repo (DEC-57).
# El proyecto de produccion es el compartido con claude-test y daily-pwt (ref en DESARROLLO.md).
project_id = "pokemon-heardle"

[functions.heardle]
# La funcion se autentica sola (token cifrado y tickets); el navegador la llama sin JWT de Supabase.
verify_jwt = false
# Fichero generado por `npm --prefix backend run build:edge` (no esta en git).
entrypoint = "./functions/heardle/index.js"

# Supabase local (`npx supabase start`) para probar la funcion: puertos 553xx para poder convivir con la
# copia local de daily-pwt (543xx) y solo los servicios que usa la funcion.
[api]
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false


[edge_runtime]
enabled = true
inspector_port = 55383
