services:
  - type: web
    name: pokemon-heardle-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    # Sin healthCheckPath ni cron: el backend solo debe despertar con trafico real (REQUISITOS 9).
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: s3
      - key: ALLOWED_ORIGIN
        sync: false
      - key: GAME_TOKEN_SECRET
        sync: false
      - key: DAILY_SEED
        sync: false
      - key: STORAGE_BUCKET
        value: heardle-audio
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
